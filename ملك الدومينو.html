<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دومينو 3D</title>
<style>
:root{--bg:#0e1218;--pn:#1b222c;--tx:#f4efe2;--gd:#e2b84e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:15px system-ui,"Segoe UI",Tahoma,sans-serif;overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none}
#app{height:100%;display:flex;flex-direction:column;gap:5px;padding:5px 6px}
#sc{display:flex;gap:6px}
.card{flex:1;background:var(--pn);border-radius:10px;padding:5px 8px;display:flex;justify-content:space-between;align-items:center;border:2px solid transparent}
.card.on{border-color:var(--gd)}.card em{font-style:normal;font-size:13px}
#seats{display:flex;gap:4px;direction:ltr}
.c{flex:1;text-align:center;background:var(--pn);border-radius:8px;padding:3px 2px;font-size:12px;border:2px solid transparent;direction:rtl}
.c.t0{border-bottom-color:#3b8}.c.t1{border-bottom-color:#c55}.c.on{border-color:var(--gd);background:#2a3340}
#cv{flex:1;min-height:0;border-radius:12px;overflow:hidden;position:relative;background:#12161c}
#cv canvas{width:100%;height:100%;display:block}
.nogl{padding:20px;text-align:center}
#toast{position:absolute;top:10px;left:10px;right:10px;text-align:center;font-weight:700;padding:8px;border-radius:10px;background:#000c;display:none}
#info{text-align:center;min-height:62px}
#ends{font-weight:700;color:var(--gd)}#msg{font-size:13px;min-height:20px}
#msg button{margin:0 4px;padding:6px 14px;border-radius:8px;border:2px solid var(--gd);background:#000;color:var(--gd);font-size:14px;font-weight:700}
#hand{display:flex;gap:4px;justify-content:center;padding-top:16px;height:122px;direction:ltr}
.tl{flex:1;max-width:54px;height:100px;background:#f3ecd8;border:2px solid #b9ad8d;border-radius:8px;padding:0;display:flex;flex-direction:column;transition:transform .12s}
.tl i{height:2px;background:#555;margin:0 5px}
.h{flex:1;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:4px}.h s{border-radius:50%}.h s.p{background:#111}
.tl.sel{transform:translateY(-14px);box-shadow:0 0 0 3px var(--gd),0 0 14px 4px #e2b84eaa}
.tl.dim{opacity:.5}.tl.bad{animation:sh .3s}
@keyframes sh{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
#btns{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.b{min-height:44px;border:0;border-radius:10px;font-size:14px;font-weight:700;font-family:inherit;color:#fff;background:#2c3644}
.b.g{background:#1b9e55}.b.r{background:#c4342d}.b.k{background:#000;border:1px solid var(--gd);color:var(--gd)}.b.k.on{background:var(--gd);color:#000}
#ov,#lobby,#pn{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#000a;z-index:9}
#ov.show,#lobby.show,#pn.show{display:flex}#ov div,#lobby div,#pn>div{background:var(--pn);padding:18px;border-radius:14px;max-width:86%;text-align:center;line-height:1.9}
#tm{color:#ff8a80;font-weight:700;font-size:13px;min-height:17px}
.fl{position:absolute;bottom:8px;width:42px;height:42px;border-radius:50%;border:0;background:#000b;color:#fff;font-size:18px;z-index:2}#mt{left:8px}#ct{right:8px;display:none}
#chat{position:fixed;left:0;right:0;bottom:0;background:var(--pn);display:none;z-index:8;border-radius:14px 14px 0 0;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px))}#chat.show{display:block}
#cl{height:140px;overflow:auto;font-size:14px;margin-bottom:6px;text-align:start}#cr{display:flex;gap:6px}
#cr input,#lobby input{flex:1;min-height:40px;border-radius:8px;border:1px solid #445;background:#0e1218;color:var(--tx);padding:0 10px;font-size:16px;font-family:inherit;max-width:100%}
#lobby div button{margin:4px;min-width:140px;padding:0 14px}#wr{min-height:22px;color:var(--gd)}
#pn{z-index:40}#pn>div{max-height:88%;overflow:auto;min-width:260px}
#title{position:fixed;inset:0;background:#05070d;z-index:30;display:none;align-items:center;justify-content:center}#title.show{display:flex}
#tbox{position:relative;width:min(100vw,66.66dvh);aspect-ratio:2/3}#timg{width:100%;height:100%;display:block}
.hs{position:absolute;background:transparent;border:0;padding:0;border-radius:50%;-webkit-tap-highlight-color:transparent}
.hs:active{box-shadow:0 0 20px 8px #e2b84e99;transform:scale(.95)}
#hp{border-radius:40px;animation:pl 1.8s infinite}@keyframes pl{50%{box-shadow:0 0 22px 6px #e2b84e88}}
.lg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0}
.lv{min-height:66px;border-radius:10px;border:1px solid #445;background:#2c3644;color:#fff;font-size:12px;font-family:inherit}.lv.ok{border-color:var(--gd)}.lv:disabled{opacity:.4}
</style></head><body>
<div id="app">
 <div id="sc"></div>
 <div id="seats"></div>
 <div id="cv"><div id="toast"></div><button class="fl" id="mt">🔊</button><button class="fl" id="ct">💬</button></div>
 <div id="info"><div id="ends"></div><div id="tm"></div><div id="msg"></div></div>
 <div id="hand"></div>
 <div id="btns">
  <button class="b g" id="bg">🟢 كمّل اللعب</button>
  <button class="b r" id="br">🔴 لا ترجع للرقم</button>
  <button class="b k" id="lk">🔒 قفل</button>
  <button class="b" id="bp">⏭ تمرير</button>
  <button class="b" id="bn">🔄 جولة جديدة</button>
  <button class="b" id="bw">🏠 الرئيسية</button>
 </div>
</div>

<script>
//<LOGIC
// قواعد النقاط (قابلة للتعديل): الدومينو = الفريق الفائز يأخذ نقاط أحجار الخصم المتبقية.
// الانسداد = الفريق ذو المجموع الأقل يأخذ نقاط الخصم؛ التعادل = لا نقاط. كل 100 نقطة = نجمة وتُطرح من الرصيد.
const RULES={handSize:7,starAt:100};
const PAT=[[],[4],[0,8],[0,4,8],[0,2,6,8],[0,2,4,6,8],[0,2,3,5,6,8]];
function makeSet(){const t=[];for(let a=0;a<=6;a++)for(let b=a;b<=6;b++)t.push([a,b]);return t}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function deal(){const s=shuffle(makeSet());return [0,1,2,3].map(p=>s.slice(p*RULES.handSize,(p+1)*RULES.handSize))}
function sides(t,e){if(!e)return['C'];const s=[];if(t.includes(e.L))s.push('L');if(t.includes(e.R))s.push('R');return s}
function legalMoves(h,e){const m=[];h.forEach((t,i)=>sides(t,e).forEach(s=>m.push({i,s})));return m}
function applyPlay(e,t,s){if(!e)return{ends:{L:t[0],R:t[1]},inner:t[0],outer:t[1]};const v=e[s],o=t[0]===v?t[1]:t[0];const n={L:e.L,R:e.R};n[s]=o;return{ends:n,inner:v,outer:o}}
function pips(h){return h.reduce((s,t)=>s+t[0]+t[1],0)}
function scoreRound(H,w){const tp=[pips(H[0])+pips(H[2]),pips(H[1])+pips(H[3])];let team=null,pts=0;
 if(w!=null){team=w%2;pts=tp[1-team]}else if(tp[0]!==tp[1]){team=tp[0]<tp[1]?0:1;pts=tp[1-team]}return{team,pts,tp}}
function addScore(sc,st,team,pts){sc[team]+=pts;while(sc[team]>=RULES.starAt){sc[team]-=RULES.starAt;st[team]++}}
function finishRound(G,w){if(G.scored)return null;G.scored=true;G.over=true;const r=scoreRound(G.hands,w);if(r.team!=null)addScore(G.scores,G.stars,r.team,r.pts);return r}
function canAct(G,p){return !G.locked&&!G.over&&G.turn===p}

const $=id=>document.getElementById(id);
const NM=['⬇ أنا','⬅ الخصم 1','⬆ شريكي','➡ الخصم 2'];
let G={scores:[0,0],stars:[0,0]},timer,R,scene,cam,board,MR,ML,cur={},actx,TG,IV,PM,PG,LG;
const TOP=.1,TURN_MS=30000;
let ONLINE=false,ME=0,isHost=false,FORCE=false,names=['','','',''],occ=[1,0,0,0],muted=false,LV=0,TARGET=100;

/* ---------- 3D ---------- */
function init3d(){
 try{R=new THREE.WebGLRenderer({antialias:true});}catch(e){R=null;$('cv').insertAdjacentHTML('afterbegin','<p class="nogl">WebGL غير متاح في هذا المتصفح: اللعب يعمل لكن بدون عرض ثلاثي الأبعاد.</p>');return}
 R.setPixelRatio(Math.min(devicePixelRatio||1,2));R.shadowMap.enabled=true;$('cv').appendChild(R.domElement);
 scene=new THREE.Scene();scene.background=new THREE.Color(0x12161c);
 cam=new THREE.PerspectiveCamera(40,1,.1,200);
 scene.add(new THREE.HemisphereLight(0xffffff,0x333a44,.75));
 const dl=new THREE.DirectionalLight(0xffffff,.85);dl.position.set(5,14,6);dl.castShadow=true;
 Object.assign(dl.shadow.camera,{left:-14,right:14,top:10,bottom:-10});dl.shadow.mapSize.set(1024,1024);scene.add(dl);
 const wood=new THREE.MeshStandardMaterial({color:0x5b3a1f,roughness:.6});
 const bx=(w,h,d,x,y,z,m)=>{const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.receiveShadow=true;scene.add(o);return o};
 bx(22.4,.5,14.4,0,-.25,0,wood);
 bx(22.4,.4,1.2,0,.2,6.6,wood);bx(22.4,.4,1.2,0,.2,-6.6,wood);bx(1.2,.4,14.4,10.6,.2,0,wood);bx(1.2,.4,14.4,-10.6,.2,0,wood);
 bx(20,.1,12,0,.05,0,new THREE.MeshStandardMaterial({color:0x0f5a3a,roughness:.95}));
 const w=.96,h=.46,r=.12,sh=new THREE.Shape();
 sh.moveTo(-w+r,-h);sh.lineTo(w-r,-h);sh.quadraticCurveTo(w,-h,w,-h+r);sh.lineTo(w,h-r);sh.quadraticCurveTo(w,h,w-r,h);
 sh.lineTo(-w+r,h);sh.quadraticCurveTo(-w,h,-w,h-r);sh.lineTo(-w,-h+r);sh.quadraticCurveTo(-w,-h,-w+r,-h);
 TG=new THREE.ExtrudeGeometry(sh,{depth:.2,bevelEnabled:true,bevelThickness:.04,bevelSize:.04,bevelSegments:2});TG.rotateX(-Math.PI/2);TG.translate(0,.04,0);
 IV=new THREE.MeshStandardMaterial({color:0xf3ecd8,roughness:.45});PM=new THREE.MeshStandardMaterial({color:0x111111,roughness:.5});
 PG=new THREE.CylinderGeometry(.085,.085,.02,14);LG=new THREE.BoxGeometry(.02,.012,.7);
 board=new THREE.Group();scene.add(board);
 const rm=new THREE.MeshBasicMaterial({color:0xe2b84e,transparent:true,opacity:.85}),rg=new THREE.RingGeometry(.25,.4,24);rg.rotateX(-Math.PI/2);
 MR=new THREE.Mesh(rg,rm);ML=new THREE.Mesh(rg,rm);MR.position.y=ML.position.y=.13;MR.visible=ML.visible=false;scene.add(MR,ML);
 new ResizeObserver(fit).observe($('cv'));fit();
 (function loop(){board.children.forEach(m=>{if(m.position.y>m.userData.ty)m.position.y=Math.max(m.userData.ty,m.position.y-.18)});R.render(scene,cam);requestAnimationFrame(loop)})();
}
function fit(){if(!R)return;const c=$('cv'),w=c.clientWidth,h=c.clientHeight;if(!w||!h)return;R.setSize(w,h);cam.aspect=w/h;cam.updateProjectionMatrix();
 const t=Math.tan(cam.fov*Math.PI/360),d=Math.max(22,12.5/(t*cam.aspect),8.5/t);cam.position.set(0,d*.9,d*.42);cam.lookAt(0,0,0)}
function mk(x,z,th,a,b){const g=new THREE.Group(),body=new THREE.Mesh(TG,IV);body.castShadow=true;g.add(body);
 const ln=new THREE.Mesh(LG,PM);ln.position.y=.305;g.add(ln);
 [[a,-.5],[b,.5]].forEach(([n,cx])=>PAT[n].forEach(k=>{const p=new THREE.Mesh(PG,PM);p.position.set(cx+(k%3-1)*.2,.305,((k/3|0)-1)*.24);g.add(p)}));
 g.position.set(x,TOP+2.5,z);g.rotation.y=th;g.userData.ty=TOP;board.add(g)}
function place3d(s,a,b,first){
 if(!R)return;const d=a===b;let x,z,th;
 if(first){x=z=0;th=d?Math.PI/2:0;cur.R={x:d?.5:1,z:0,dx:1,dz:0,run:0};cur.L={x:d?-.5:-1,z:0,dx:-1,dz:0,run:0}}
 else{const c=cur[s],len=d?1:2;
  if((c.dx&&Math.abs(c.x+c.dx*len)>8.2)||(c.dz&&c.run>=2)){const nx=c.dz?-c.dz:0,nz=c.dx?c.dx:0;c.x+=(c.dx+nx)*.5;c.z+=(c.dz+nz)*.5;c.dx=nx;c.dz=nz;c.run=0}
  x=c.x+c.dx*len/2;z=c.z+c.dz*len/2;th=Math.atan2(-c.dz,c.dx)+(d?Math.PI/2:0);c.x+=c.dx*len;c.z+=c.dz*len;c.run++}
 mk(x,z,th,a,b);MR.position.set(cur.R.x+cur.R.dx,.13,cur.R.z+cur.R.dz);ML.position.set(cur.L.x+cur.L.dx,.13,cur.L.z+cur.L.dz);MR.visible=ML.visible=true}

function tone(f,t0,d,type){if(!actx)return;const o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(.25,actx.currentTime+t0);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+t0+d);o.connect(g);g.connect(actx.destination);o.start(actx.currentTime+t0);o.stop(actx.currentTime+t0+d)}
function initAudio(){if(!actx){const A=window.AudioContext||window.webkitAudioContext;if(A)actx=new A()}if(actx&&actx.state==='suspended')actx.resume()}
function signal(k){initAudio();if(ONLINE){fbSend({k});return toast('أُرسلت الإشارة لشريكك')}showSig(k)}
function showSig(k){
 if(k==='g'){tone(660,0,.14,'sine');tone(880,.15,.22,'sine');toast('🟢 إشارة لشريكك: كمّل اللعب')}
 else{tone(190,0,.28,'sawtooth');tone(140,.3,.35,'sawtooth');toast('🔴 إشارة لشريكك: ما ترجعش لهذا الرقم')}}

/* ---------- واجهة ---------- */
const half=n=>'<div class="h">'+[...Array(9)].map((_,k)=>'<s'+(PAT[n].includes(k)?' class="p"':'')+'></s>').join('')+'</div>';
function renderHand(){const my=G.turn===ME&&!G.over&&!G.locked;
 $('hand').innerHTML=G.hands[ME].map((t,i)=>'<button class="tl'+(G.sel===i?' sel':'')+(my&&!sides(t,G.ends).length?' dim':'')+'" data-i="'+i+'">'+half(t[0])+'<i></i>'+half(t[1])+'</button>').join('')}
function ui(){
 $('sc').innerHTML=[0,1].map(t=>{const k=(t+ME)%2;return '<div class="card'+(G.turn%2===k&&!G.over?' on':'')+'"><b>'+(t?'خصومنا':'فريقنا')+'</b><span>'+G.scores[k]+'/'+RULES.starAt+'</span><em>'+(G.stars[k]>5||(LV&&!ONLINE&&k===ME%2)?'⭐ '+G.stars[k]+(LV&&!ONLINE&&k===ME%2?'/'+KING:''):('⭐'.repeat(G.stars[k])||'—'))+'</em></div>'}).join('');
 $('seats').innerHTML=[1,2,3,0].map(v=>{const p=(v+ME)%4;return '<div class="c t'+(p%2===ME%2?0:1)+(G.turn===p&&!G.over?' on':'')+'">'+lab(p)+'<br><b>'+G.hands[p].length+'</b> أحجار</div>'}).join('');
 $('ends').textContent=G.ends?'الطرف الأيسر: '+G.ends.L+'  •  الطرف الأيمن: '+G.ends.R:'الطاولة فارغة';
 $('lk').textContent=G.locked?'🔓 فتح':'🔒 قفل';$('lk').classList.toggle('on',!!G.locked);renderHand()}

/* ---------- اللعب ---------- */
function onTile(i){
 if(G.busy||G.over)return;
 if(G.locked)return msg('🔒 الطاولة مقفلة — افتحها أولًا');
 if(G.turn!==ME)return msg('ليس دورك الآن');
 const t=G.hands[ME][i],s=sides(t,G.ends);
 if(!s.length){G.sel=null;renderHand();$('hand').children[i].classList.add('bad');return msg('هذا الحجر لا يطابق أي طرف ('+G.ends.L+' / '+G.ends.R+')')}
 G.sel=i;renderHand();sfx('sel');
 if(s.length===1||G.ends.L===G.ends.R)return commit(ME,i,s[0]);
 $('msg').innerHTML='<span style="direction:ltr;display:inline-block"><button data-s="L">◀ يسار ('+G.ends.L+')</button><button data-s="R">يمين ('+G.ends.R+') ▶</button><button data-s="A">🤖 تلقائي</button></span>';
 $('msg').querySelectorAll('button').forEach(b=>b.onclick=()=>commit(ME,i,b.dataset.s==='A'?bestSide(t,i):b.dataset.s))}
function bestSide(t,i){const rest=G.hands[ME].filter((_,k)=>k!==i).flat();let best='L',bs=-1;sides(t,G.ends).forEach(s=>{const e=G.ends[s],o=t[0]===e?t[1]:t[0],c=rest.filter(v=>v===o).length;if(c>bs){bs=c;best=s}});return best}
function commit(p,i,s){
 if(!mine(p)||!canAct(G,p)||G.busy&&p===ME)return;const t=G.hands[p][i];if(!t||!sides(t,G.ends).includes(s))return;
 G.busy=true;const first=!G.ends,r=applyPlay(G.ends,t,s);
 G.hands[p].splice(i,1);G.ends=r.ends;G.passes=0;G.sel=null;place3d(first?'C':s,r.inner,r.outer,first);G.log.push([first?'C':s,r.inner,r.outer,first]);sfx('place');
 if(!G.hands[p].length){ui();return endRound(p)}
 G.turn=(p+1)%4;G.dl=Date.now()+TURN_MS;sync();setTimeout(()=>{G.busy=false;tick()},250)}
function doPass(p){
 if(!mine(p))return;if(!canAct(G,p))return p===ME&&G.locked?msg('🔒 الطاولة مقفلة'):0;
 if(G.ends&&legalMoves(G.hands[p],G.ends).length)return msg('عندك حجر صالح — لا يمكن التمرير');
 if(!G.ends)return msg('ابدأ بأي حجر');
 if(G.lack&&G.ends){const a=G.lack[p];[G.ends.L,G.ends.R].forEach(v=>{if(!a.includes(v))a.push(v)})}G.passes++;sfx('pass');toast(nm(p)+' مرّر');if(G.passes>=4)return endRound(null);G.turn=(p+1)%4;G.dl=Date.now()+TURN_MS;sync();tick()}
function auto0(p){
 if(!canAct(G,p))return;const m=legalMoves(G.hands[p],G.ends);
 if(!m.length)return doPass(p);
 const c=pick(p,m);commit(p,c.i,c.s)}
const sk=p=>LV&&!ONLINE&&p%2!==ME%2?(LV-1)/7:Math.max(.5,LV&&!ONLINE?(LV-1)/7:0);
function pick(p,m){const k=sk(p),H=G.hands[p];if(Math.random()<(1-k)*.85)return m[Math.random()*m.length|0];
 let best=m[0],bs=-1e9;m.forEach(x=>{const t=H[x.i],e=applyPlay(G.ends,t,x.s).ends,rest=H.filter((_,j)=>j!==x.i).flat();let sc=t[0]+t[1]+(t[0]===t[1]?3:0);
  [e.L,e.R].forEach(v=>{sc+=rest.filter(z=>z===v).length*2;if(G.lack)for(let q=0;q<4;q++)if(q!==p&&G.lack[q].includes(v))sc+=q%2===p%2?-6:6});
  if(k>.7&&e.L===e.R)sc+=2;if(sc>bs){bs=sc;best=x}});return best}
function auto(p){FORCE=true;try{auto0(p)}finally{FORCE=false}}
function ai(){if(aiOwns(G.turn))auto(G.turn)}
function tick(){clearTimeout(timer);ui();if(G.over||G.locked)return;
 if(G.turn===ME){const k=G.log.length+':'+G.passes;if(tick.l!==k){tick.l=k;sfx('turn')}msg(G.ends&&!legalMoves(G.hands[ME],G.ends).length?'ما عندك حجر صالح — سيتم التمرير تلقائيًا':G.ends?'دورك — اختر حجرًا':'ابدأ بأي حجر');if(G.ends&&!legalMoves(G.hands[ME],G.ends).length)timer=setTimeout(()=>auto(ME),1300);return}
 msg('دور '+nm(G.turn)+'…');timer=setTimeout(ai,850)}
function showRes(){const r=G.res,k=ME%2,mine=r.team===k;
 $('ovt').innerHTML=(r.w!=null?'🏁 خرج '+nm(r.w):'⛔ انسداد اللعب')+'<br>أحجار متبقية: فريقنا '+r.tp[k]+' | خصومنا '+r.tp[1-k]+'<br><b>'+(r.team==null?'تعادل — لا نقاط':(mine?'فاز فريقنا':'فاز خصومنا')+' بـ '+r.pts+' نقطة')+'</b>';
 if(r.career)$('ovt').innerHTML+='<br>'+(r.star>0?'⭐ حصلت على نجمة جديدة!<br>':'')+'رصيدك: '+P.pts+'/100 نقطة • '+P.stars+'/'+KING+' ⭐'+(r.king?'<br><b>👑 لقد أصبحت ملك الدومينو!</b>':'');
 $('ovb').textContent='جولة جديدة';$('ovb').onclick=newRound;$('ov').classList.add('show');sfx(r.king||mine?'win':r.team==null?'pass':'lose')}
function endRound(w){clearTimeout(timer);const r=finishRound(G,w);if(!r)return;G.res=Object.assign({w},r);
 if(LV&&!ONLINE){const k=ME%2,s0=P.stars;P.pts=G.scores[k];P.stars=G.stars[k];if(r.team===k){P.rounds++;P.wins++}
  G.res.career=1;G.res.star=P.stars-s0;if(P.stars>=KING&&!P.king){P.king=true;G.res.king=1}save()}
 ui();showRes();sync()}
function newRound(){
 if(ONLINE&&!isHost)return toast('المضيف فقط يبدأ الجولة');if(LV&&!ONLINE){LV=rankOf(P.stars);G.scores[0]=P.pts;G.stars[0]=P.stars}clearTimeout(timer);$('ov').classList.remove('show');const H=deal();
 Object.assign(G,{hands:H,ends:null,passes:0,over:false,scored:false,locked:false,sel:null,busy:false,log:[],lack:[[],[],[],[]],res:null,round:(G.round||0)+1,ver:G.ver||0,dl:Date.now()+TURN_MS});
 let best=-1,st=0;H.forEach((h,p)=>h.forEach(t=>{const v=(t[0]===t[1]?100:0)+t[0]+t[1];if(v>best){best=v;st=p}}));G.turn=st;
 if(board)while(board.children.length)board.remove(board.children[0]);if(MR)MR.visible=ML.visible=false;sync();tick()}
function newGame(){if(ONLINE&&!isHost)return toast('المضيف فقط');G.scores=[0,0];G.stars=[0,0];newRound()}

/* ---------- ربط الأزرار ---------- */
$('hand').addEventListener('click',e=>{const b=e.target.closest('.tl');if(b){initAudio();onTile(+b.dataset.i)}});
$('bg').onclick=()=>signal('g');$('br').onclick=()=>signal('r');
$('lk').onclick=()=>{if(G.over)return;G.locked=!G.locked;toast(G.locked?'🔒 تم قفل الدومينو':'🔓 تم فتح الدومينو');G.dl=Date.now()+TURN_MS;sync();tick()};
$('bp').onclick=()=>doPass(0);$('bn').onclick=newRound;$('ovb').onclick=newRound;
$('bw').onclick=()=>{if(confirm('العودة للشاشة الرئيسية؟'))toTitle()};

const aiOwns=p=>p!==ME&&(!ONLINE||(isHost&&!occ[p]));
const mine=p=>p===ME||aiOwns(p)||FORCE;

function clack(v){if(!actx)return;const t=actx.currentTime,n=actx.sampleRate*.09|0,b=actx.createBuffer(1,n,actx.sampleRate),d=b.getChannelData(0);
 for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3);
 const s=actx.createBufferSource();s.buffer=b;const f=actx.createBiquadFilter();f.type='bandpass';f.frequency.value=2200;f.Q.value=.8;const g=actx.createGain();g.gain.value=v;s.connect(f);f.connect(g);g.connect(actx.destination);s.start(t);
 const o=actx.createOscillator(),og=actx.createGain();o.frequency.setValueAtTime(180,t);o.frequency.exponentialRampToValueAtTime(55,t+.12);og.gain.setValueAtTime(Math.min(v,1),t);og.gain.exponentialRampToValueAtTime(.001,t+.14);o.connect(og);og.connect(actx.destination);o.start(t);o.stop(t+.15)}
